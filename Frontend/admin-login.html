<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife Gym - Admin Login</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="center-screen">
    <div class="login-card">
        [cite_start]<h2>FitLife Gym Admin [cite: 6]</h2>
        [cite_start]<p>Login as Admin [cite: 7]</p>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="Username (admin)" required>
            <input type="password" id="adminPass" placeholder="Password (admin123)" required>
            <button type="submit">Login</button>
        </form>
        <a href="index.html" style="display: block; text-align: center; margin-top: 1rem; color: #64748b;">Back to Kiosk</a>
    </div>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('adminUser').value === 'admin' && document.getElementById('adminPass').value === 'admin123') {
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid credentials');
            }
        });
    </script>
</body>
</html>
