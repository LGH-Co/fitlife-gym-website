<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife Gym - RFID Access Kiosk</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/kiosk.css">
</head>
<body>
    <div class="timer-badge" id="timeoutBadge">60s Remaining</div>
    <div class="kiosk-container">
        <div class="search-box">
            <h1>FitLife Gym</h1>
            <p>RFID Access Kiosk</p>
            <div class="kiosk-instruction">
                Tap your RFID card or enter your ID. <br>
                System will automatically log you in or out. [cite: 85, 106]
            </div>
            <div class="input-group">
                <input type="text" id="rfidInput" placeholder="Tap RFID card or enter ID/Name..." autofocus>
                <button id="scanBtn">Scan</button>
            </div>
        </div>
        <div id="userProfileCard"></div>
    </div>
    <div class="admin-portal-link">
        <a href="admin-login.html">Admin Login</a>
    </div>
    <script type="module" src="js/kiosk.js"></script>
</body>
</html>
